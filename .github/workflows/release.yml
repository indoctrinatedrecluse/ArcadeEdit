name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: arcade-edit-${{ github.ref_name }}-windows-x86_64.zip
            mode: desktop-and-headless
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: arcade-headless-${{ github.ref_name }}-linux-x86_64.tar.gz
            mode: headless-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Windows binaries (Desktop + Headless)
        if: matrix.mode == 'desktop-and-headless'
        shell: pwsh
        run: |
          cargo build --release --target ${{ matrix.target }} -p arcade-desktop -p arcade-headless
          Copy-Item target/${{ matrix.target }}/release/arcade-desktop.exe .
          Copy-Item target/${{ matrix.target }}/release/arcade-headless.exe .
          Invoke-WebRequest -Uri "https://github.com/indoctrinatedrecluse/ir-cli-utility/releases/download/v3.8/ir-windows.zip" -OutFile "ir-windows.zip"
          Expand-Archive -Path "ir-windows.zip" -DestinationPath "ir_dist" -Force
          Copy-Item "ir_dist/bin/ir.exe" .
          Compress-Archive -Path arcade-desktop.exe, arcade-headless.exe, ir.exe, README.md, CHANGELOG.md -DestinationPath ${{ matrix.artifact_name }}

      - name: Build Linux binary (Headless CLI)
        if: matrix.mode == 'headless-only'
        run: |
          cargo build --release --target ${{ matrix.target }} -p arcade-headless
          cp target/${{ matrix.target }}/release/arcade-headless .
          curl -sL "https://github.com/indoctrinatedrecluse/ir-cli-utility/releases/download/v3.8/ir-linux.tar.gz" -o "ir-linux.tar.gz"
          mkdir -p ir_dist && tar -xzf ir-linux.tar.gz -C ir_dist
          cp ir_dist/bin/ir . || cp ir_dist/ir . || true
          tar -czf ${{ matrix.artifact_name }} arcade-headless ir README.md CHANGELOG.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-package
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          body_path: CHANGELOG.md
          generate_release_notes: true
